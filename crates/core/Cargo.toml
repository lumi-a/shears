[package]
name = "shears-core"
description = "Core graph model and analysis for shears, a KubeJS recipe-graph pruning tool."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
fs = ["dep:walkdir"]
parallel = []

[dependencies]
fancy-regex = "0.19.2"
fixedbitset = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
toml = "0.8"
walkdir = { version = "2", optional = true }

[dev-dependencies]
proptest = "1"
shears-core = { path = ".", features = ["fs"] }
tar = "0.4"
tempfile = "3"
zstd = "0.13"
